<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #070914;
    color: #FBFBFF;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    flex-direction: column;
  }
  .topbar { height: 10px; background: linear-gradient(90deg, #FF8A24, #53D8FF); flex-shrink: 0; }
  .wrap { flex: 1; padding: 48px 72px 52px; display: flex; flex-direction: column; }
  .strip {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #C3C7D6;
  }
  .strip svg { width: 54px; height: 54px; display: block; }
  h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    line-height: 0.96;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-top: 36px;
    font-size: 88px;
  }
  .hl {
    background: #FF8A24;
    color: #070914;
    padding: 0 16px 4px;
  }
  .sub {
    margin-top: 30px;
    font-size: 26px;
    line-height: 1.4;
    color: rgba(251, 251, 255, 0.72);
    max-width: 940px;
  }
  .cmd {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 18px;
    border: 3px solid #C3C7D6;
    background: #15152B;
    padding: 20px 28px;
    font-size: 26px;
    font-weight: 500;
  }
  .cmd .dollar { color: #FF8A24; font-weight: 600; }
  .cmd .path { color: #FBFBFF; }
  .cmd .tag {
    margin-left: auto;
    border: 3px solid #FF8A24;
    color: #FF8A24;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.12em;
    padding: 8px 16px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="wrap">
    <div class="strip">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect x="10" y="10" width="48" height="48" fill="#53D8FF"/>
        <rect x="4" y="4" width="48" height="48" fill="#FF8A24" stroke="#070914" stroke-width="4"/>
        <path d="M11 14 L21 14 L35 28 L21 42 L11 42 L23 28 Z" fill="#070914"/>
        <rect x="40" y="20" width="5.5" height="16" fill="#070914"/>
      </svg>
      <span>Open source / youtube-creator-skills</span>
    </div>
    <h1>Creator skills<br>for <span class="hl">YouTube</span></h1>
    <p class="sub">Plan, script, and ship every video — without losing your voice. Nine skills your agent follows, start to finish.</p>
    <div class="cmd">
      <span class="dollar">$</span>
      <span class="path">npx skills add ITZSHOAIB/youtube-creator-skills</span>
      <span class="tag">One command install</span>
    </div>
  </div>
</body>
</html>
